# Qwen3.8-27B on one RTX 3090, containerized. See docs/docker.md.
#
#   docker compose --profile single up -d     # low latency: MTP speculative decoding
#   docker compose --profile batch  up -d     # throughput
#   docker compose run --rm prepare           # just download + requantize the model
#   docker compose run --rm single verify     # verify.sh inside the container
#
# Knobs go in a .env file next to this file (never committed): VLLM_API_KEY=...,
# and any of the start-script variables (CTX, KV, MAX_LEN, MAX_SEQS, GPU_UTIL, VISION,
# SPEC_ATTN, DRAFT_TOKENS, EXTRA_ARGS, ...) — .env is passed straight into the
# container. Fastest single-user decode, if the card is yours alone (README,
# "If you are the only user"; the drafter it needs is already downloaded by
# prepare):
#
#   printf 'SPEC=dflash2\nDFLASH_TOKENS=15\nPREFIX_CACHE=1\n' >> .env
#
# On WSL2 add VLLM_WSL2_ENABLE_PIN_MEMORY=1 to that .env: SPEC=dflash2 forces vLLM's
# V2 model runner, whose UVA buffers are refused there by default, and the container
# aborts at "RuntimeError: UVA is not available" before loading weights (docs/docker.md).
# PORT and MODELS_DIR are read here: models live in ./models by default
# (the same layout as the venv install, so both can share one download).
# One GPU: run either "single" or "batch", not both.
#
# More than one GPU (issues #68, #104) — no hand-edit of this file needed:
#
#   GPU_COUNT=2                                  # cards handed to the container
#   EXTRA_ARGS="--tensor-parallel-size 2"        # cards the engine actually uses
#
# GPU_COUNT defaults to 1, which means "the first GPU the runtime enumerates",
# i.e. GPU 0 — not the card you meant if the box has mixed hardware. To choose
# *which* cards, expose them all and pin inside the container:
#
#   GPU_COUNT=all
#   CUDA_VISIBLE_DEVICES=1,2
#
# The device reservation below decides which cards are visible, so setting
# NVIDIA_VISIBLE_DEVICES in .env alone was not enough (#68); CUDA_VISIBLE_DEVICES
# is read inside the container and is what docs/gotchas.md 53 recommends.
# Pin the KV pool before you benchmark or trim context on a multi-GPU box: the
# launcher skips the single-card KV_MEM pin under --tensor-parallel-size > 1,
# so the pool is sized from GPU_UTIL and moves with compile-cache state
# (README, "More than one GPU"; docs/gotchas.md 48).
# Three or more GPUs: a single engine cannot span all of them for this model
# (README, "More than one GPU" — TP=3/PP=3 are rejected), so "solo" runs a
# second standalone engine, the same single-user launcher on its own card
# and port. Expose every card and pin each engine inside its container:
#
#   GPU_COUNT=all
#   CUDA_VISIBLE_DEVICES=0,1                 # the "single"/"batch" pair
#   EXTRA_ARGS="--tensor-parallel-size 2"
#
#   docker compose --profile single --profile solo up -d
#
# "solo" sets its own CUDA_VISIBLE_DEVICES=2 below (an explicit environment:
# entry wins over .env, so the pair stays on 0,1). With two serve containers
# up, keep VLLM_OFFLOAD_KEEP_SHM=1 in .env: each launcher's stale-region
# reaper sees only its own container's processes (#33) and would delete the
# other engine's live offload region.

x-qwen: &qwen
  # Prebuilt on every main push by .github/workflows/docker-image.yml; the
  # first `up` pulls it (~9.5 GB, pull_policy below) instead of the 20-minute
  # local build. `docker compose build` (or `up --build`) still builds the
  # identical image under the same tag name. Immutable per-commit tags:
  # ghcr.io/syv-ai/hyperqwen:sha-<7>.
  # HQ_IMAGE: per-invocation image override (local). -2xl pins the pre-vLLM-0.29 image, because on
  # 0.29 KVarN + MTP decodes 12-18% slower at long context (lower draft acceptance).
  image: ${HQ_IMAGE:-ghcr.io/syv-ai/hyperqwen:latest}
  build: .
  pull_policy: missing
  ipc: host
  # Run as the host user instead of the image's default root (no USER in
  # its Dockerfile) - without this, every file the container writes under
  # the models/ bind mount (prepare/'s quant output, int8 head/embed/mtp
  # shrink, backup files, etc.) comes out root-owned, requiring a manual
  # `sudo chown` before the host user can touch it. GPU access via the
  # nvidia runtime and binding to ${PORT} (unprivileged, >1024) don't need
  # root, so this has no functional downside. UID/GID default to 1000:1000
  # (this box's `rex` user); override via .env if that ever differs.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  env_file:
    - path: .env
      required: false
  environment:
    HOME: /cache
    # Must be forwarded explicitly: the ports: mapping below substitutes ${PORT}
    # at the compose-file level (host side), but that alone does NOT put PORT in
    # the container's own env. Without this, start_qwen.sh's `PORT=${PORT:-18020}`
    # always falls back to 18020 inside the container, while llama-swap maps
    # host:<dynamic-port> -> container:<dynamic-port> - a mismatch that's silent
    # whenever llama-swap happens to pick 18020, and a "connection reset by peer"
    # / 5-minute health-check timeout every other time. Confirmed 2026-08-27.
    PORT: ${PORT:-18020}
    # Same forwarding problem as PORT above: env_file only injects what's
    # literally written in .env, so a per-invocation override from the
    # `cmd:` line (llama-swap running the same compose file under two
    # different profiles, e.g. syv vs syv-max) needs these named here to
    # reach the container at all. Unset ones fall through to
    # start_qwen.sh's own defaults (CTX=fast, SPEC=mtp, PREFIX_CACHE unset).
    CTX: ${CTX:-}
    SPEC: ${SPEC:-}
    PREFIX_CACHE: ${PREFIX_CACHE:-}
    DFLASH_TOKENS: ${DFLASH_TOKENS:-}
    KV_OFFLOAD_GB: ${KV_OFFLOAD_GB:-}
    # API_SERVERS: batch/start_qwen.sh's --api-server-count (default 1) -
    # multiple frontend processes sharing one engine, meant for exactly
    # syv-swarm's shape (high request-rate, short completions -> HTTP/
    # tokenize/serialize overhead, not raw GPU compute, is the likely
    # bottleneck). Untested in this repo before 2026-09-04.
    API_SERVERS: ${API_SERVERS:-}
    # PREFILL_ATTN: int8-QK prefill attention (single-user/start_qwen.sh only,
    # not batch/), used by syv-max (llama-swap.yml). INT8_ACT: W4A8 Marlin
    # activation quant (single-user/batch both read it; batch/start_qwen.sh
    # defaults it on, single-user/start_qwen.sh defaults it OFF) - forwarded
    # so syv-max's llama-swap.yml cmd: override actually reaches the
    # container instead of silently falling through to that off default.
    # EXTRA_ARGS: general per-invocation override slot, currently unused by
    # any live config - kept forwarded since it's the same per-invocation
    # gotcha as CTX/SPEC above and a future override will need it wired here
    # regardless.
    PREFILL_ATTN: ${PREFILL_ATTN:-}
    INT8_ACT: ${INT8_ACT:-}
    EXTRA_ARGS: ${EXTRA_ARGS:-}
    # MODEL/BASE_MODEL_DIR: point single-user/start_qwen.sh (and docker/prepare.sh's
    # BASE_MODEL_DIR) at an alternate checkpoint under the models/ bind mount --
    # e.g. the AutoRound quant of huihui-ai's abliterated build (2026-08-30),
    # a sibling of the default Qwen3.8-27B-W4A16-AutoRound dir. Unset falls
    # through to each script's own default.
    MODEL: ${MODEL:-}
    BASE_MODEL_DIR: ${BASE_MODEL_DIR:-}
    # VISION=1 keeps the vision tower (default drops it via
    # --language-model-only); VISION_OFFLOAD (default 1 whenever VISION=1)
    # keeps the tower's weights in pinned host RAM instead of resident VRAM
    # - near-free (891MB->9MB resident, +37ms/image encode, gotcha 9) and
    # required for SPEC=dflash2 to boot at all with VISION=1 on CTX=fast
    # (reproduced: dies in graph capture without it). Forwarded so
    # llama-swap.yml's per-model VISION=1 override actually reaches the
    # container instead of falling through to the off default.
    VISION: ${VISION:-}
    VISION_OFFLOAD: ${VISION_OFFLOAD:-}
    # MAX_LEN: same per-invocation forwarding gotcha as CTX/SPEC/MODEL
    # above - start_qwen.sh reads it directly (single-user/start_qwen.sh:165
    # onward, USER_MAX_LEN precedence chain), but it wasn't in this list
    # before 2026-09-16, so any llama-swap.yml cmd: override silently never
    # reached the container - it just fell through to each SPEC/CTX
    # profile's own hardcoded default with no error. Found wiring up
    # qwen-3.8-27b-syv-swift, which needed a smaller-than-default context
    # budget to leave room for KV cache on an unusually large checkpoint.
    MAX_LEN: ${MAX_LEN:-}
    # MAX_SEQS: same forwarding gotcha as MAX_LEN above, found 2026-09-20 -
    # llama-swap's qwen-3.8-27b-syv-swift-unc-2x90k set MAX_SEQS=2 but the
    # engine ran max_num_seqs=64, because it was not in this list. Every
    # launcher reads it as ${MAX_SEQS:-<default>}, so an empty value here
    # falls back to each tier's own default.
    MAX_SEQS: ${MAX_SEQS:-}
  volumes:
    - ${MODELS_DIR:-./models}:/app/models
    - qwen-cache:/cache
    # reasoning_effort "high" -> HTTP 400 fix (2026-09-16, found via
    # noonghunna/club-3090's qwen38-reasoning-effort-template patch - see
    # patches/reasoning-effort-high/PROVENANCE.md). Qwen3.8's chat template
    # ladder is low/medium/xhigh - there is no "high" - and the stock
    # template raise_exception()s on anything else. Both OpenAI and
    # Anthropic default to low/medium/high, so any generic client sending
    # the standard top rung gets a clean 400 on vLLM 0.28.0 here (club-3090
    # saw an unhandled 500 on their older pin - our vLLM catches the same
    # jinja TemplateError more gracefully, but the underlying template gap
    # is identical). Confirmed via /v1/models and /health both still
    # returning 200 while the chat request fails - looks healthy, isn't.
    # This mounted template adds a 3-line alias: "high" -> "xhigh" (the
    # real top rung, not "medium" - see PROVENANCE.md's "Why xhigh and not
    # medium" for why a mid-point alias was rejected upstream). Traffic
    # that sends no reasoning_effort is unaffected (server default is
    # ENABLE_THINKING's own low/xhigh split, untouched). One bind mount per
    # served checkpoint dir - all six share the identical byte-for-byte
    # base template (sha256 c3cf9e34...81041, verified locally), so one
    # patched file covers all of them.
    - ./patches/reasoning-effort-high/chat_template.jinja:/app/models/Qwen3.8-27B-W4A16-AutoRound/chat_template.jinja:ro
    - ./patches/reasoning-effort-high/chat_template.jinja:/app/models/Qwen3.8-27B-W4A16-AutoRound-fast/chat_template.jinja:ro
    - ./patches/reasoning-effort-high/chat_template.jinja:/app/models/Qwen3.8-27B-W4A16-AutoRound-abliterated/Huihui-Qwen3.8-27B-abliterated-w4g128/chat_template.jinja:ro
    - ./patches/reasoning-effort-high/chat_template.jinja:/app/models/Qwen3.8-27B-Uncensored-W4A16/chat_template.jinja:ro
    - ./patches/reasoning-effort-high/chat_template.jinja:/app/models/Swift-Qwen3.8-27b-W4A16-AutoRound/chat_template.jinja:ro
    - ./patches/reasoning-effort-high/chat_template.jinja:/app/models/Qwen3.8-27B-Uncensored-W4A16-leminkozey/chat_template.jinja:ro
    - ./patches/reasoning-effort-high/chat_template.jinja:/app/models/Qwen3.8-27B-W4A16-AutoRound-swift-unc/Swift-Qwen3.8-27B-Uncensored-BF16-w4g128/chat_template.jinja:ro
    - ./patches/reasoning-effort-high/chat_template.jinja:/app/models/Qwen3.8-27B-W4A16-AutoRound-swift-unc-gptq-full/chat_template.jinja:ro
    - ./patches/reasoning-effort-high/chat_template.jinja:/app/models/Swift-Qwen3.8-27B-W4A16-syv-fast/chat_template.jinja:ro

x-serve: &serve
  <<: *qwen
  ports:
    - "${PORT:-18020}:${PORT:-18020}"
  depends_on:
    prepare:
      condition: service_completed_successfully
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            # 1 by default (= GPU 0). GPU_COUNT=2 / GPU_COUNT=all for TP; see
            # the multi-GPU note in the header for picking specific cards.
            count: ${GPU_COUNT:-1}
            capabilities: [gpu]
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:${PORT:-18020}/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 900s   # first start: torch.compile + CUDA graphs + FlashInfer JIT

services:
  prepare:
    <<: *qwen
    command: prepare

  single:
    <<: *serve
    profiles: [single]
    command: single

  batch:
    <<: *serve
    profiles: [batch]
    command: batch

  # Second standalone engine on its own card (TP=1, same launcher, own
  # port). Inert unless --profile solo; needs GPU_COUNT=all in .env so the
  # reservation exposes the extra card. See the header for the layout.
  solo:
    <<: *serve
    profiles: [solo]
    command: single
    environment:
      # YAML merge keys are shallow, so this block replaces the anchor's
      # environment rather than extending it — re-declare HOME, or the
      # container gets /root and the torch.compile/FlashInfer JIT cache
      # lands in its writable layer instead of the qwen-cache volume.
      HOME: /cache
      PORT: "${SOLO_PORT:-18021}"
      CUDA_VISIBLE_DEVICES: "2"  # explicit value wins over .env's 0,1
      EXTRA_ARGS: ""             # one card: .env's --tensor-parallel-size must not apply
    ports:
      - "${SOLO_PORT:-18021}:${SOLO_PORT:-18021}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:${SOLO_PORT:-18021}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s

volumes:
  qwen-cache:
